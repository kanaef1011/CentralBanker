<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Bank Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
<style>
/* Layout: central bank policy room — tools column | data dashboard | cause-and-effect column */
:root {
  --bg: #eef1ee;
  --surface: #ffffff;
  --surface-2: #f6f8f6;
  --ink: #14201c;
  --muted: #5b6a63;
  --line: #d6ddd8;
  --accent: #0e6a54;
  --accent-ink: #ffffff;
  --brass: #a87a26;
  --good: #2c8148; --warn: #b8730c; --bad: #bf3d2a;
  --good-bg: #e3f1e7; --warn-bg: #fbefd9; --bad-bg: #f8e3df;
  --s-pi: #bf3d2a; --s-u: #2b5c9c; --s-g: #0e6a54; --s-rate: #14201c; --s-L: #2b5c9c; --s-lend: #a87a26;
  --f-display: "Fraunces", "Georgia", "Times New Roman", serif;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311; --surface: #151e1b; --surface-2: #1b2622; --ink: #e4ebe7; --muted: #95a59d; --line: #2a3732;
    --accent: #3cb08c; --accent-ink: #06150f; --brass: #d3a54e;
    --good: #5cc07c; --warn: #e3a23c; --bad: #ef7a63;
    --good-bg: #173023; --warn-bg: #352812; --bad-bg: #3a1d18;
    --s-pi: #ef7a63; --s-u: #79a6e6; --s-g: #3cb08c; --s-rate: #e4ebe7; --s-L: #79a6e6; --s-lend: #d3a54e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311; --surface: #151e1b; --surface-2: #1b2622; --ink: #e4ebe7; --muted: #95a59d; --line: #2a3732;
  --accent: #3cb08c; --accent-ink: #06150f; --brass: #d3a54e;
  --good: #5cc07c; --warn: #e3a23c; --bad: #ef7a63;
  --good-bg: #173023; --warn-bg: #352812; --bad-bg: #3a1d18;
  --s-pi: #ef7a63; --s-u: #79a6e6; --s-g: #3cb08c; --s-rate: #e4ebe7; --s-L: #79a6e6; --s-lend: #d3a54e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font: 650 22px/1.25 var(--f-display); }
h3 { font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
b, strong { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; }
.brand h1 { font: 650 19px/1.15 var(--f-display); }
.brand .sub { font-size: 12px; color: var(--muted); }
.hstat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.hstat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.hstat .v { font-weight: 600; font-size: 14px; }
.qbar { display: flex; gap: 3px; }
.qbar i { width: 12px; height: 8px; border-radius: 2px; background: var(--line); }
.qbar i.on { background: var(--accent); }
.qbar i.y { margin-left: 4px; }
.cred { width: 90px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.cred > span { display: block; height: 100%; background: var(--brass); }

nav.tabs { display: flex; gap: 4px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 11px 12px 10px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
nav.tabs button .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); font-size: 11px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button[aria-selected="true"] .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

main { padding: 16px 20px 40px; }
.view { display: none; }
.view.on { display: block; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.acc { background: transparent; color: var(--accent); border-color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { padding: 12px 14px; font-size: 15px; width: 100%; }

/* Briefing */
.brief-grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; }
.sc-list { display: flex; flex-direction: column; gap: 8px; }
.sc { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.sc .nm { font-weight: 600; font-size: 15px; }
.sc .tg { color: var(--muted); font-size: 12.5px; }
.sc[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.brief-text { max-width: 68ch; font-size: 15px; }
.challenge { border-left: 3px solid var(--brass); padding: 6px 12px; background: var(--surface-2); border-radius: 0 8px 8px 0; max-width: 68ch; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
ul.clean { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th, .tbl td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--surface-2); }
.tbl td.l { text-align: left; white-space: normal; min-width: 160px; }

/* Policy room */
.play { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.ctl h3 { margin-bottom: 8px; }
.tool { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.tool:first-of-type { border-top: 0; padding-top: 0; }
.tool .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tool .name { font-weight: 600; }
.info { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.bignum { font-size: 30px; font-weight: 600; line-height: 1.1; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .sbtn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 18px; line-height: 1; }
.stepper .mid { flex: 1; text-align: center; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 6px 2px; font-size: 11.5px; line-height: 1.2; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.quote { font-size: 12.5px; font-style: italic; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }
.bs { display: grid; gap: 4px; font-size: 12.5px; }
.bsbar { height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; overflow: hidden; border: 1px solid var(--line); }
.bsbar span { position: absolute; top: 0; bottom: 0; left: 0; background: var(--s-L); opacity: .75; }
.bsbar em { position: absolute; top: 0; bottom: 0; background: var(--brass); }
.fc table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.fc td, .fc th { padding: 3px 4px; text-align: right; }
.fc th { color: var(--muted); font-weight: 500; }
.fc td:first-child, .fc th:first-child { text-align: left; }
.toggle { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; }
.toggle input { margin-top: 3px; accent-color: var(--accent); }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.kpi.good { border-left-color: var(--good); } .kpi.warn { border-left-color: var(--warn); } .kpi.bad { border-left-color: var(--bad); } .kpi.neu { border-left-color: var(--s-L); }
.kpi .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .val { font-size: 24px; font-weight: 600; line-height: 1.2; }
.kpi .meta { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 10px 4px; position: relative; min-width: 0; }
.chart .ct { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 2px 2px; }
.chart .ct b { font-size: 13px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); padding: 2px 2px 4px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height: 2px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.adas svg text { fill: var(--muted); font-size: 10.5px; font-family: var(--f-body); }
.adas .adas-svg { margin: 6px 0 2px; }
.chart svg text { fill: var(--muted); font-size: 10.5px; font-family: var(--f-body); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 11.5px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; z-index: 5; display: none; line-height: 1.45; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

.chain { display: grid; gap: 0; }
.node { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.node .nk { font-size: 12.5px; }
.node .nv { font-weight: 600; font-size: 13.5px; display: flex; gap: 6px; align-items: center; }
.arr { font-size: 11px; width: 16px; text-align: center; }
.arr.up { color: var(--bad); } .arr.dn { color: var(--s-u); } .arr.fl { color: var(--muted); }
.link { display: flex; align-items: center; gap: 8px; padding: 2px 0 2px 18px; font-size: 11px; color: var(--muted); }
.link::before { content: ""; width: 1px; height: 16px; background: var(--muted); opacity: .5; }
.expect { margin-top: 8px; font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; }
.why { display: grid; gap: 8px; }
.why .it { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.why .it .tg { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; padding-top: 2px; }
.contrib { display: grid; gap: 3px; font-size: 12px; }
.contrib .cr { display: grid; grid-template-columns: 112px minmax(0, 1fr) 48px; gap: 6px; align-items: center; }
.contrib .bar { height: 10px; position: relative; background: var(--surface-2); border-radius: 3px; }
.contrib .bar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .6; }
.contrib .bar span { position: absolute; top: 1px; bottom: 1px; border-radius: 2px; }
.contrib .num { text-align: right; }
.news { display: grid; gap: 8px; }
.ni { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; font-size: 13px; }
.ni.bad { border-left-color: var(--bad); } .ni.good { border-left-color: var(--good); }
.ni .q { font-size: 11px; color: var(--muted); }
.ask { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; border-left: 3px solid var(--brass); }

/* Evaluate */
.eval-top { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; }
.gradebox { display: grid; place-items: center; text-align: center; gap: 4px; }
.grade { font: 650 64px/1 var(--f-display); color: var(--accent); }
.score { font-size: 15px; font-weight: 600; }
.parts { display: grid; gap: 10px; }
.part { display: grid; grid-template-columns: 170px minmax(0, 1fr) 44px; gap: 10px; align-items: center; }
.part .pb { height: 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.part .pb span { display: block; height: 100%; background: var(--accent); }
.part .pd { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -6px; }
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ins { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.ins .k { font-size: 12px; color: var(--muted); }
.ins .v { font-size: 20px; font-weight: 600; }
.ins .d { font-size: 12px; color: var(--muted); }
textarea { width: 100%; min-height: 120px; font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
input[type=text] { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }

/* Compare */
.cmp-list { display: grid; gap: 6px; }
.cmp-item { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.cmp-item .sw { width: 14px; height: 4px; border-radius: 2px; flex: none; }
.cmp-item .x { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; }

/* Learn */
.learn { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.learn .panel { display: grid; gap: 8px; align-content: start; }
.learn dl { margin: 0; display: grid; gap: 6px; }
.learn dt { font-weight: 600; font-size: 12.5px; color: var(--accent); }
.learn dd { margin: 0; font-size: 13.5px; }
.eq { font-size: 13px; background: var(--surface-2); border-radius: 6px; padding: 6px 10px; }

/* Dialogs */
.overlay { position: fixed; inset: 0; background: rgba(8, 14, 12, .5); display: none; place-items: center; z-index: 50; padding: 16px; }
.overlay.on { display: grid; }
.dialog { background: var(--surface); color: var(--ink); border-radius: 12px; max-width: 520px; width: 100%; padding: 20px; display: grid; gap: 12px; border: 1px solid var(--line); max-height: 90vh; overflow: auto; }

@media (max-width: 1320px) {
  .play { grid-template-columns: 290px minmax(0, 1fr); }
  .play .side { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .play, .brief-grid, .eval-top, .two { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .part { grid-template-columns: 120px minmax(0, 1fr) 40px; }
  main { padding: 12px 16px 32px; }
  .top { padding: 10px 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .cred > span, .part .pb span, .bsbar span { transition: width .3s ease; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 13 17 7l10 6zM9 15h3v9H9zm6.5 0h3v9h-3zM22 15h3v9h-3zM7 26h20v2H7z" fill="var(--accent-ink)"/></svg>
    <div><h1>Central Bank Simulator</h1><div class="sub">You are the Governor. Each turn is one quarter; your term lasts 3 years.</div></div>
  </div>
  <div class="hstat"><span class="k">Scenario</span><span class="v" id="hScen"></span></div>
  <div class="hstat"><span class="k" id="hQlabel"></span><span class="qbar" id="hQbar"></span></div>
  <div class="hstat"><span class="k">Credibility</span><span class="row" style="gap:8px"><span class="cred"><span id="hCred"></span></span><span class="v" id="hCredV"></span></span></div>
  <div class="hstat"><span class="k">Running score</span><span class="v" id="hScore"></span></div>
</header>
<nav class="tabs" role="tablist" aria-label="Stages">
  <button role="tab" data-tab="brief" id="tab-brief"><span class="n">1</span>Briefing</button>
  <button role="tab" data-tab="play" id="tab-play"><span class="n">2</span>Set policy &amp; observe</button>
  <button role="tab" data-tab="eval" id="tab-eval"><span class="n">3</span>Evaluate</button>
  <button role="tab" data-tab="compare" id="tab-compare"><span class="n">4</span>Compare strategies</button>
  <button role="tab" data-tab="learn" id="tab-learn"><span class="n">?</span>Learn &amp; model</button>
</nav>
<main>
  <section class="view" id="v-brief"></section>
  <section class="view" id="v-play"></section>
  <section class="view" id="v-eval"></section>
  <section class="view" id="v-compare"></section>
  <section class="view" id="v-learn"></section>
</main>
<div class="overlay" id="ov"><div class="dialog" role="dialog" aria-modal="true" id="dlg"></div></div>
<script>
// ===== ECONOMIC MODEL (pure, no DOM) =====
const PI_TARGET = 2;
const N_Q = 12;

const SCENARIOS = {
  'lam-phat': {
    name: 'Inflation surge',
    tag: 'Overheating economy',
    brief: 'After a period of heavy stimulus, spending is booming while supply chains are jammed. Inflation is more than three times the target and unemployment is at a record low. The policy rate is still near zero, and the central bank balance sheet is still swollen from earlier rounds of QE.',
    challenge: 'Bring inflation back to 2% without pushing the economy into a deep recession.',
    pi0: 6.8, piPrev: 6.0, yPre: [-0.6, 0.4, 1.1, 1.6], y0: 1.9, u0: 3.6, i0: 0.5, B0: 32, c0: 0.6,
    rstar: 0.5, uStar: 4.5, gPot: 2.0, tp: 0.8, sp: 1.8, stress0: 0, supply0: 1.1, supplyRho: 0.7, demand0: 0.2,
    events: {
      2: { title: 'Global energy prices cool', text: 'Oil prices fall 15% from last quarter, easing pressure on production costs.', supply: -0.5, kind: 'good' },
      5: { title: 'Unions win 7% pay rises', text: 'Many industries raise wages to catch up with past inflation. Risk of a wage–price spiral.', supply: 0.45, kind: 'bad' },
      8: { title: 'Housing market stalls', text: 'Home sales drop sharply as mortgage rates bite.', demand: -0.35, kind: 'bad' }
    }
  },
  'suy-thoai': {
    name: 'Demand-driven recession',
    tag: 'Firms cutting investment',
    brief: 'Business confidence has collapsed after a trade shock. Orders are falling, factories are cutting shifts and unemployment is rising fast. Inflation is still close to target but drifting down.',
    challenge: 'Stop the slide and bring unemployment back to its natural rate without creating inflation later.',
    pi0: 2.1, piPrev: 2.4, yPre: [0.5, 0.2, -0.4, -1.0], y0: -1.6, u0: 5.5, i0: 4.5, B0: 12, c0: 0.75,

function fcArr(H, fc, k, spread) {

  return { mid, lo, hi };

      <div class="it"><span class="tg">Real rate</span><span>Borrowing rate ${pct(s.lend)} minus expected inflation ${pct(s.piE)} = real interest rate ${pct(s.rl)}. Compared with neutral, financial conditions are <b>${stF(s.f)[1].toLowerCase()}</b>.</span></div>
    </div>`;
    return;
  }
  const r = APP.run.H[t], p = APP.run.H[t - 1], items = explainRow(r, p);
  const dy = r.y - p.y, dpi = r.pi - p.pi;
  box.innerHTML = `<div class="row" style="justify-content:space-between"><h3>Why did the economy change in ${qName(t)}?</h3><span class="small muted">Based on the model's assumptions</span></div>
    <div class="why">${items.map(x => `<div class="it"><span class="tg">${x.tag}</span><span>${x.html}</span></div>`).join('')}</div>
    <div class="two">
      <div class="stack" style="gap:6px"><b class="small">Aggregate demand changed ${fmtS(dy, 2)} pp because of:</b>${contribRows([
        ['Self-correction', r.cy.inertia, 'var(--muted)'], ['Financial conditions', r.cy.fin, 'var(--s-L)'], ['Outside events', r.cy.demand, 'var(--brass)'], ['Surprises', r.cy.shock, 'var(--s-pi)']], 0.5)}</div>
      <div class="stack" style="gap:6px"><b class="small">Inflation changed ${fmtS(dpi, 2)} pp because of:</b>${contribRows([
        ['Expectations & inertia', r.cpi.expect, 'var(--muted)'], ['Demand pressure', r.cpi.demand, 'var(--brass)'], ['Supply shocks (oil, wages…)', r.cpi.supply, 'var(--s-pi)'], ['Surprises', r.cpi.shock, 'var(--s-u)']], 0.5)}</div>
    </div>`;
}
function explainRow(r, p) {
  const out = [];
  // Policy
  let pol = r.di > 0.01 ? `You <b>raised</b> the policy rate by ${fmt(r.di, 2)} pp to ${pct(r.i, 2)}.` : r.di < -0.01 ? `You <b>cut</b> the policy rate by ${fmt(-r.di, 2)} pp to ${pct(r.i, 2)}.` : `You <b>held</b> the policy rate at ${pct(r.i, 2)}.`;
  if (r.qe > 0.01) pol += ` You bought bonds worth ${fmt(r.qe, 1)}% of GDP (QE), taking the balance sheet to ${fmt(r.B, 0)}% of GDP.`;
  else if (r.qe < -0.01) pol += ` You shrank the balance sheet by ${fmt(-r.qe, 1)}% of GDP (QT), leaving ${fmt(r.B, 0)}% of GDP.`;
  pol += ` Guidance: “${fgText(r.fg).short.toLowerCase()}”.`;
  const broke = (p.fg >= 1 && r.di < -0.01) || (p.fg <= -1 && r.di > 0.01);
  const kept = (p.fg >= 1 && r.di > 0.01) || (p.fg <= -1 && r.di < -0.01);
  if (broke) pol += ` <b style="color:var(--bad)">You acted against last quarter's guidance, so credibility fell</b> (${Math.round(p.c * 100)} → ${Math.round(r.c * 100)}).`;
  else if (kept) pol += ' Your action matched last quarter\'s guidance, which strengthens credibility.';
  out.push({ tag: 'Policy', html: pol });
  // Markets
  const dL = r.L - p.L;
  const comp = [
    [0.5 * (r.i - p.i), 'the change in the policy rate'],
    [0.5 * (r.piE - p.piE), 'the change in expected inflation'],
    [r.tp - p.tp, r.B !== p.B ? (r.B > p.B ? 'central bank bond buying (QE) lowering the term premium' : 'central bank selling (QT) raising the term premium') : 'a change in market stress'],
    [0.35 * (r.fg * r.c - p.fg * p.c), 'forward guidance shifting expectations of future rates']
  ].sort((a, b) => Math.abs(b[0]) - Math.abs(a[0]));
  out.push({ tag: 'Markets', html: Math.abs(dL) < 0.03 ? `The 10-year bond yield barely moved (${pct(r.L, 2)}).` : `The 10-year bond yield ${dL > 0 ? 'rose' : 'fell'} ${fmt(Math.abs(dL), 2)} pp to ${pct(r.L, 2)}, mainly because of ${comp[0][1]} (${fmtS(comp[0][0], 2)})${Math.abs(comp[1][0]) > 0.05 ? ` and ${comp[1][1]} (${fmtS(comp[1][0], 2)})` : ''}. Markets react almost instantly.` });
  // Credit
  let cr = `Average borrowing rate ${pct(p.lend)} → <b>${pct(r.lend)}</b>. After subtracting expected inflation of ${pct(r.piE)}, the real rate is ${pct(r.rl)}, so financial conditions are <b>${stF(r.f)[1].toLowerCase()}</b>. Credit is growing ${pct(r.credit)} a year.`;
  if (r.stress > 0.5) cr += ` Markets are stressed, so banks demand an extra ${fmt(r.sp, 1)} pp risk spread.`;
  if (r.credit > 12) cr += ' <b style="color:var(--warn)">Credit is growing too fast: risk of an asset bubble.</b>';
  out.push({ tag: 'Credit', html: cr });
  // Demand
  let ad = `Demand vs capacity: ${fmtS(p.y)}% → <b>${fmtS(r.y)}%</b>. `;
  ad += r.cy.fin < -0.15 ? 'High real borrowing costs lead firms to delay investment and households to cut back on mortgages and car loans. ' : r.cy.fin > 0.15 ? 'Cheap credit encourages firms to invest and households to spend. ' : '';
  ad += 'Most of this effect comes from decisions made 1–2 quarters ago (the lag).';
  if (r.event && r.event.demand) ad += ` The event “${esc(r.event.title)}” contributed ${fmtS(r.event.demand)} pp.`;
  out.push({ tag: 'Demand', html: ad });
  // Jobs
  const du = r.u - p.u;
  out.push({ tag: 'Jobs', html: `Unemployment ${pct(p.u)} → <b>${pct(r.u)}</b>. ${Math.abs(du) < 0.05 ? 'The labour market barely moved.' : du < 0 ? 'Output rose, so firms hired more workers.' : 'Output fell, so firms cut jobs.'} Firms adjust staffing more slowly than output (Okun's law).` });
  // Inflation
  const drv = [[r.cpi.expect, 'expectations and price inertia'], [r.cpi.demand, 'demand pressure'], [r.cpi.supply, 'supply shocks (input costs)']].sort((a, b) => Math.abs(b[0]) - Math.abs(a[0]));
  out.push({ tag: 'Inflation', html: `Inflation ${pct(p.pi)} → <b>${pct(r.pi)}</b> (core ${pct(r.core)}). Main driver: ${drv[0][1]} (${fmtS(drv[0][0], 2)} pp). ${r.cpi.demand > 0.1 ? 'Demand above capacity lets firms raise prices.' : r.cpi.demand < -0.1 ? 'Weak demand holds firms back from raising prices.' : ''}` });
  // Model vs outcome
  if (r.fc) {
    const ep = r.pi - r.fc.pi, ey = r.y - r.fc.y;
    if (Math.abs(ep) > 0.2 || Math.abs(ey) > 0.3) {
      const why = [r.event ? `the event “${esc(r.event.title)}”` : '', (Math.abs(r.shock.d) > 0.15 || Math.abs(r.shock.p) > 0.12) ? 'surprises outside the model' : ''].filter(Boolean).join(' and ');
      out.push({ tag: 'Uncertainty', html: `Without surprises, the model would have produced inflation of ${pct(r.fc.pi)} and a demand gap of ${fmtS(r.fc.y)}%; the actual figures were ${pct(r.pi)} and ${fmtS(r.y)}%. The difference came from ${why || 'surprises'}. Policymaking always involves uncertainty.` });
    } else out.push({ tag: 'Uncertainty', html: `Few surprises this quarter: the outcome was close to what the model predicts from your decision.` });
  }
  return out;
}

function reflectQ() {
  const t = T(), H = APP.run.H, s = cur(), p = H[t - 1];
  if (t === 0) return 'Look at the starting indicators: what is the biggest problem? If you could use only one tool, which would you pick, and why?';
  if (t >= N_Q) return 'If you could do it again, which decision would you change first? Try it in the "Compare strategies" tab.';
  if ((p.fg >= 1 && s.di < -0.01) || (p.fg <= -1 && s.di > 0.01)) return 'You just went back on your word. Next time you give guidance, how much will markets believe you?';
  if (s.i <= 0.01 && s.y < -1) return 'The policy rate is at 0%. What other tools do you have to lower long-term borrowing costs and support the economy?';
  if (s.cpi && s.cpi.supply > 0.3) return 'Inflation rose because of a supply shock. Will raising interest rates bring oil prices down? If not, why might a central bank still need to respond?';
  if (t <= 3 && H.slice(1).some(r => Math.abs(r.di) > 0.4) && Math.abs(s.y - H[0].y) < 0.8) return 'You changed the policy rate, but output and unemployment have hardly moved. Why do the effects take so long to show up?';
  if (s.pi < p.pi - 0.15 && s.u > p.u + 0.05) return 'Inflation is falling but unemployment is rising. What trade-off is this? How much extra unemployment will you accept to bring inflation down?';
  if (s.c < p.c - 0.02 && s.pi > 3) return 'Credibility is slipping because inflation is persisting. Does that make bringing inflation down easier or harder? Why?';
  if (s.credit > 12) return 'Credit is growing very fast. What could go wrong if this continues for several years?';
  if (s.fc && Math.abs(s.pi - s.fc.pi) > 0.3) return 'The outcome included surprises outside the model. When the future is uncertain, should a central bank act boldly or move cautiously, step by step?';
  if (Math.abs(s.pi - 2) < 0.5 && Math.abs(s.u - SC().uStar) < 0.5) return 'The indicators are close to target. If you hold rates steady, what does the staff forecast say will happen over the next 4 quarters? Do you agree?';
  return 'If you were a family paying off a mortgage, how would this quarter\'s decision affect you? What about a saver?';
}

// ===== AD–AS GRAPH (actual state only; does not react to the draft decision) =====
const S_AD = 1.0, S_AS = 0.5; // illustrative slopes
function adasDiag(y, pi) {
  if (y > 0.5 && pi > 3) return 'Demand too strong: output above potential (right of LRAS), inflation above target.';
  if (y < -0.5 && pi > 3) return 'Stagflation: SRAS has shifted up, so output is below potential but inflation is still high.';
  if (y < -0.5 && pi < 1.5) return 'Weak demand: output below potential (left of LRAS), inflation below target.';
  if (y > 0.5 && pi < 1.5) return 'High output with low inflation: supply conditions are favourable.';
  if (y < -0.5) return 'Output below potential: there is spare capacity.';
  if (y > 0.5) return 'Output above potential: the economy is running hot.';
  if (pi > 3) return 'Output near potential but inflation still high: expectations have not come down yet.';
  if (pi < 1) return 'Output near potential but inflation is low.';
  return 'Close to ideal: equilibrium near LRAS and the 2% target.';
}
function adasShiftText(r, p) {
  const dAD = (r.y - p.y) + (r.pi - p.pi) / S_AD;
  const dAS = (r.pi - p.pi) - S_AS * (r.y - p.y);
  const pickReason = (comps, sign) => { const c = comps.filter(x => Math.sign(x[0]) === sign && Math.abs(x[0]) > 0.03).sort((a, b) => Math.abs(b[0]) - Math.abs(a[0]))[0]; return c ? c[1] : null; };
  let s = [];
  if (Math.abs(dAD) > 0.15) {
    const sg = Math.sign(dAD);
    const why = pickReason([
      [r.cy.fin, sg < 0 ? 'high borrowing costs (a lagged effect of earlier quarters)' : 'cheaper borrowing (a lagged effect of earlier quarters)'],
      [r.cy.demand, sg < 0 ? 'an outside event that cut spending' : 'an outside event that boosted spending'],
      [r.cy.inertia, 'the economy gradually correcting towards potential'],
      [r.cy.shock, 'surprises outside the model']], sg);
    s.push(`<b>AD shifted ${sg < 0 ? 'left' : 'right'}</b>${why ? ' because of ' + why : ''}.`);
  } else s.push('AD barely moved.');
  if (Math.abs(dAS) > 0.15) {
    const sg = Math.sign(dAS);
    const why = pickReason([
      [r.cpi.expect, sg > 0 ? 'inflation expectations and price inertia' : 'cooling inflation expectations'],
      [r.cpi.supply, sg > 0 ? 'rising input costs (a supply shock)' : 'falling input costs'],
      [r.cpi.demand, sg > 0 ? 'wage pressure in a tight labour market' : 'easing wage pressure as unemployment rises'],
      [r.cpi.shock, 'surprises outside the model']], sg);
    s.push(`<b>SRAS shifted ${sg > 0 ? 'up (less supply)' : 'down (more supply)'}</b>${why ? ' because of ' + why : ''}.`);
  } else s.push('SRAS barely moved.');
  return s.join(' ');
}
function renderADAS() {
  const box = $('#adas'); if (!box) return;
  const t = T(), r = cur(), p = t > 0 ? APP.run.H[t - 1] : null;
  box.innerHTML = `<div class="row" style="justify-content:space-between"><h3 style="margin:0">Where the economy is now</h3><button class="info" data-learn="adas">How to read this</button></div>
    <div class="adas-svg"></div>
    <div class="legend"><span><i style="background:var(--s-u)"></i>AD</span><span><i style="background:var(--s-pi)"></i>SRAS</span><span><i style="background:var(--ink)"></i>LRAS</span>${p ? '<span><i class="dash" style="color:var(--muted)"></i>last quarter</span>' : ''}</div>
    <p class="small"><b>Equilibrium</b> <span style="color:var(--brass)">●</span> output ${fmtS(r.y)}% vs potential, inflation ${pct(r.pi)}. ${adasDiag(r.y, r.pi)}</p>
    ${p ? `<p class="small muted" style="margin-top:4px">${qName(t)}: ${adasShiftText(r, p)}</p>` : ''}
    <p class="small muted" style="margin-top:4px">AD shifts gradually over several quarters: today's decision mostly shows up on this graph 1–3 quarters later.</p>`;
  box.querySelector('[data-learn]').onclick = () => learnDialog('adas');
  const host = box.querySelector('.adas-svg');
  const W = Math.max(240, host.clientWidth || 270), H = 236;
  const m = { l: 26, r: 10, t: 22, b: 34 };
  const pts = [[r.y, r.pi]].concat(p ? [[p.y, p.pi]] : []);
  const R = Math.max(4, ...pts.map(q => Math.abs(q[0]) + 1.8));
  let lo = Math.min(0, ...pts.map(q => q[1] - 2.5)), hi = Math.max(5, ...pts.map(q => q[1] + 2.5));
  lo = Math.floor(lo); hi = Math.ceil(hi);
  const X = x => m.l + (x + R) / (2 * R) * (W - m.l - m.r);
  const Y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const adLine = q => { const x1 = -R, x2 = R; return [X(x1), Y(q[1] - S_AD * (x1 - q[0])), X(x2), Y(q[1] - S_AD * (x2 - q[0]))]; };
  const asLine = q => { const x1 = -R, x2 = R; return [X(x1), Y(q[1] + S_AS * (x1 - q[0])), X(x2), Y(q[1] + S_AS * (x2 - q[0]))]; };
  const ln = (c, col, w, dash, op) => `<line x1="${c[0]}" y1="${c[1]}" x2="${c[2]}" y2="${c[3]}" stroke="${col}" stroke-width="${w}" ${dash ? 'stroke-dasharray="4 3"' : ''} opacity="${op || 1}" stroke-linecap="round"/>`;
  let g = `<defs><clipPath id="adClip"><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/></clipPath>
    <marker id="arrAD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--s-u)"/></marker>
    <marker id="arrAS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--s-pi)"/></marker></defs>`;
  // frame & axes
  g += `<line x1="${m.l}" y1="${H - m.b}" x2="${W - m.r}" y2="${H - m.b}" stroke="var(--muted)"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H - m.b}" stroke="var(--muted)"/>`;
  for (let v = lo; v <= hi; v += (hi - lo > 8 ? 2 : 1)) g += `<text x="${m.l - 5}" y="${Y(v) + 3.5}" text-anchor="end">${fmt(v, 0)}</text>`;
  g += `<text x="${m.l}" y="${H - m.b + 13}" text-anchor="start">${fmtS(-R, 0)}%</text><text x="${W - m.r}" y="${H - m.b + 13}" text-anchor="end">${fmtS(R, 0)}%</text>`;
  g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">Real output vs potential →</text>`;
  g += `<text x="0" y="11">↑ Price level / inflation (%)</text>`;
  // inflation target
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(2)}" y2="${Y(2)}" stroke="var(--good)" stroke-dasharray="3 3" opacity=".8"/><text x="${W - m.r - 2}" y="${Y(2) + 12}" text-anchor="end" style="fill:var(--good)">Target 2%</text>`;
  // LRAS
  g += `<line x1="${X(0)}" x2="${X(0)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink)" stroke-width="2"/><text x="${X(0) + 4}" y="${m.t + 22}" style="fill:var(--ink);font-weight:600">LRAS</text><text x="${X(0)}" y="${H - m.b + 13}" text-anchor="middle" style="fill:var(--ink)">Y*</text>`;
  g += `<g clip-path="url(#adClip)">`;
  if (p) g += ln(adLine([p.y, p.pi]), 'var(--s-u)', 1.5, 1, .45) + ln(asLine([p.y, p.pi]), 'var(--s-pi)', 1.5, 1, .45);
  g += ln(adLine([r.y, r.pi]), 'var(--s-u)', 2.5) + ln(asLine([r.y, r.pi]), 'var(--s-pi)', 2.5);
  // shift arrows
  if (p) {
    const piA = r.pi + 0.35 * (hi - r.pi);
    const xo = p.y + (p.pi - piA) / S_AD, xn = r.y + (r.pi - piA) / S_AD;
    if (Math.abs(xn - xo) > 0.15) g += `<line x1="${X(xo)}" y1="${Y(piA)}" x2="${X(xn)}" y2="${Y(piA)}" stroke="var(--s-u)" stroke-width="1.5" marker-end="url(#arrAD)"/>`;
    const x0 = Math.min(R * 0.7, Math.max(r.y, p.y) + 1.2);
    const yo = p.pi + S_AS * (x0 - p.y), yn = r.pi + S_AS * (x0 - r.y);
    if (Math.abs(yn - yo) > 0.15) g += `<line x1="${X(x0)}" y1="${Y(yo)}" x2="${X(x0)}" y2="${Y(yn)}" stroke="var(--s-pi)" stroke-width="1.5" marker-end="url(#arrAS)"/>`;
    g += `<circle cx="${X(p.y)}" cy="${Y(p.pi)}" r="4" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>`;
  }
  g += `</g>`;
  // curve labels
  const adEndY = Math.min(H - m.b - 4, Math.max(m.t + 10, Y(r.pi - S_AD * (R * 0.8 - r.y))));
  g += `<text x="${X(R * 0.8)}" y="${adEndY - 4}" text-anchor="middle" style="fill:var(--s-u);font-weight:600">AD</text>`;
  const asLblY = Math.min(H - m.b - 4, Math.max(m.t + 10, Y(r.pi + S_AS * (-R * 0.8 - r.y))));
  g += `<text x="${X(-R * 0.8)}" y="${asLblY - 5}" text-anchor="middle" style="fill:var(--s-pi);font-weight:600">SRAS</text>`;
  // equilibrium
  g += `<line x1="${X(r.y)}" x2="${X(r.y)}" y1="${Y(r.pi)}" y2="${H - m.b}" stroke="var(--brass)" stroke-dasharray="2 3"/>`;
  g += `<circle cx="${X(r.y)}" cy="${Y(r.pi)}" r="5" fill="var(--brass)" stroke="var(--surface)" stroke-width="1.5"/>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Aggregate demand and supply graph: output ${fmtS(r.y)}% vs potential, inflation ${pct(r.pi)}">${g}</svg>`;
}

// ===== 3. EVALUATE =====
const benchCache = {};
function benchmarks() {
  const k = `${APP.key}|${APP.run.seed}|${APP.run.noise}`;
  if (!benchCache[k]) {
    const ta = simulateStrategy(APP.key, APP.run.seed, APP.run.noise, taylorDecision);
    const ho = simulateStrategy(APP.key, APP.run.seed, APP.run.noise, holdDecision);
    benchCache[k] = { taylor: { run: ta, score: scoreRun(ta) }, hold: { run: ho, score: scoreRun(ho) } };
  }
  return benchCache[k];
}
function runStats(run) {
  const sc = SCENARIOS[run.key], H = run.H, rows = H.slice(1);
  const inBand = rows.filter(r => r.pi >= 1 && r.pi <= 3).length;
