<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Central Bank Simulator</title>
    <!-- Nạp font từ Google Fonts: Be Vietnam Pro (chữ thường) và Fraunces (tiêu đề). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap"
      rel="stylesheet"
    />
    <!--
       CSS được chia theo từng phần. Thứ tự quan trọng:
       base.css (biến màu) phải nạp trước, responsive.css nạp sau cùng để ghi đè.
    -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/views/briefing.css" />
    <link rel="stylesheet" href="css/tables.css" />
    <link rel="stylesheet" href="css/views/policy-room.css" />
    <link rel="stylesheet" href="css/views/evaluate.css" />
    <link rel="stylesheet" href="css/views/compare.css" />
    <link rel="stylesheet" href="css/views/learn.css" />
    <link rel="stylesheet" href="css/dialogs.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- Thanh trên cùng. Các thẻ có id (hScen, hQbar...) để trống, JavaScript sẽ điền nội dung. -->
    <header class="top">
      <div class="brand">
        <div
          class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary-container to-secondary-container flex items-center justify-center shadow-[0_0_15px_rgba(128,131,255,0.35)]"
        >
          <span class="material-symbols-outlined text-on-primary text-[22px]"
            >account_balance</span
          >
        </div>
        <div>
          <h1>Central Bank Simulator</h1>
          <div class="sub">
            You are the Governor. Each turn is one quarter; your term lasts 3
            years.
          </div>
        </div>
      </div>
      <div class="hstat">
        <span class="k">Scenario</span><span class="v" id="hScen"></span>
      </div>
      <div class="hstat">
        <span class="k" id="hQlabel"></span
        ><span class="qbar" id="hQbar"></span>
      </div>
      <div class="hstat">
        <span class="k">Credibility</span
        ><span class="row" style="gap: 8px"
          ><span class="cred"><span id="hCred"></span></span
          ><span class="v" id="hCredV"></span
        ></span>
      </div>
      <div class="hstat">
        <span class="k">Running score</span><span class="v" id="hScore"></span>
      </div>
      <div>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </header>
    <!-- Thanh tab. data-tab cho JavaScript biết bấm nút nào thì mở tab nào. -->
    <nav class="tabs" role="tablist" aria-label="Stages">
      <button role="tab" data-tab="brief" id="tab-brief">
        <span class="n">1</span>Briefing
      </button>
      <button role="tab" data-tab="play" id="tab-play">
        <span class="n">2</span>Set policy &amp; observe
      </button>
      <button role="tab" data-tab="eval" id="tab-eval">
        <span class="n">3</span>Evaluate
      </button>
      <button role="tab" data-tab="compare" id="tab-compare">
        <span class="n">4</span>Compare strategies
      </button>
      <button role="tab" data-tab="learn" id="tab-learn">
        <span class="n">?</span>Learn &amp; model
      </button>
    </nav>
    <!-- Nội dung chính: mỗi <section> là một tab. HTML bên trong do các file js/views/*.js tạo ra. -->
    <main>
      <section class="view" id="v-brief"></section>
      <section class="view" id="v-play"></section>
      <section class="view" id="v-eval"></section>
      <section class="view" id="v-compare"></section>
      <section class="view" id="v-learn"></section>
    </main>
    <!-- Hộp thoại dùng chung (ẩn cho tới khi cần). -->
    <div class="overlay" id="ov">
      <div class="dialog" role="dialog" aria-modal="true" id="dlg"></div>
    </div>
    <!--
       type="module" cho phép dùng import/export.
       Chỉ cần nạp main.js; nó sẽ tự import các file JavaScript khác.
    -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
